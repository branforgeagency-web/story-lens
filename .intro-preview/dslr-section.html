
  <!-- =========================================================================
       00B // INTERACTIVE 3D DSLR (Three.js — follows the cursor, click to shoot)
       ========================================================================= -->
  <section class="dslr-hero" id="dslrHero" aria-label="Interactive 3D camera">
    <div class="dslr-glow" aria-hidden="true"></div>
    <div class="dslr-canvas-wrap" aria-hidden="true"></div>
    <div class="dslr-overlay" aria-hidden="true"></div>
    <div class="dslr-flash" aria-hidden="true"></div>

    <div class="dslr-content">
      <p class="dslr-eyebrow"><span></span>Interactive Studio Rig</p>
      <h2 class="dslr-title">
        Every frame
        <span>starts with the <em>right lens.</em></span>
      </h2>
      <p class="dslr-desc">
        Meet the kit behind Story Lens. Aim the lens with your cursor, then click to take the shot.
      </p>
    </div>

    <div class="dslr-hud" aria-hidden="true">
      <span class="dslr-rec"><i></i>REC</span>
      <span>FRAME <b class="dslr-shots">0000</b></span>
      <span class="dslr-hud-meta">f/1.4 · 1/50 · ISO 800 · 24 FPS</span>
    </div>

    <div class="dslr-hint" aria-hidden="true">
      <span class="dslr-mouse"><span></span></span>
      <p>Move to aim · Click to shoot</p>
    </div>

    <div class="dslr-loading">
      <span class="dslr-loader"></span>
      <p>Loading 3D camera</p>
    </div>
  </section>
